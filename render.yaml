services:
  - type: web
    name: paanagam-localboost-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Set both secrets in the Render dashboard from the Neon project.
      # DATABASE_URL must be the pooled (-pooler) connection string.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL must be the direct/unpooled connection string for Prisma migrations.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY_BASE64
        sync: false
      - key: CORS_ORIGIN
        value: https://paanagam-localboost-dashboard.onrender.com
      - key: APP_BASE_URL
        value: https://paanagam-localboost-dashboard.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://paanagam-localboost-api.onrender.com/v1/google/callback

  - type: web
    name: paanagam-localboost-dashboard
    runtime: static
    buildCommand: mkdir -p public-dist && cp index.html styles.css growth-intelligence.css app.js growth.js growth-intelligence.js config.js auth-client.js public-dist/ && printf '%s\n' 'window.LOCALBOOST_API_BASE = "https://paanagam-localboost-api.onrender.com"; window.LOCALBOOST_NEON_AUTH_URL = "https://ep-floral-paper-aotvi0zj.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth";' > public-dist/config.js
    staticPublishPath: ./public-dist
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

