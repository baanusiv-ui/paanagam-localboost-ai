services:
  - type: web
    name: paanagam-localboost-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: paanagam-localboost-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY_BASE64
        sync: false
      - key: CORS_ORIGIN
        value: https://paanagam-localboost-dashboard.onrender.com
      - key: APP_BASE_URL
        value: https://paanagam-localboost-dashboard.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://paanagam-localboost-api.onrender.com/v1/google/callback

  - type: web
    name: paanagam-localboost-dashboard
    runtime: static
    region: singapore
    buildCommand: mkdir -p public-dist && cp index.html styles.css app.js config.js public-dist/ && printf '%s\n' 'window.LOCALBOOST_API_BASE = "https://paanagam-localboost-api.onrender.com";' > public-dist/config.js
    staticPublishPath: ./public-dist
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: paanagam-localboost-db
    databaseName: localboost
    user: localboost
    region: singapore
    plan: free
    postgresMajorVersion: "16"
