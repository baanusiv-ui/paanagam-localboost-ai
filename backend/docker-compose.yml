services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: localboost
      POSTGRES_PASSWORD: localboost_dev
      POSTGRES_DB: localboost
    ports:
      - "5432:5432"
    volumes:
      - localboost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localboost -d localboost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localboost_pgdata: