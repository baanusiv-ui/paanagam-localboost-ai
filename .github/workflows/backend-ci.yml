name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docs/**"
      - "app.js"
      - "config.js"
      - "index.html"
      - "styles.css"
      - "growth-intelligence.js"
      - "growth-intelligence.css"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app.js"
      - "config.js"
      - "index.html"
      - "styles.css"
      - "growth-intelligence.js"
      - "growth-intelligence.css"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://localboost:localboost_dev@localhost:5432/localboost?schema=public
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
      - run: npm run api:check
      - run: npm run security:check
      - name: Check dashboard JavaScript syntax
        working-directory: .
        run: node --check app.js && node --check growth-intelligence.js
