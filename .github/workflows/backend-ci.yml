name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docs/**"
      - "app.js"
      - "auth-client.js"
      - "config.js"
      - "index.html"
      - "styles.css"
      - "growth-intelligence.js"
      - "growth.js"
      - "growth-intelligence.css"
      - "crm.js"
      - "crm.css"
      - "gbp-owner.css"
      - "gbp-owner.js"
      - "creative-studio.js"
      - "social-publishing.js"
      - "growth-goals.js"
      - "growth-goals.css"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app.js"
      - "config.js"
      - "index.html"
      - "styles.css"
      - "growth-intelligence.js"
      - "growth-intelligence.css"
      - "crm.js"
      - "crm.css"
      - "gbp-owner.css"
      - "gbp-owner.js"
      - "creative-studio.js"
      - "growth-goals.js"
      - "growth-goals.css"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://localboost:localboost_dev@localhost:5432/localboost?schema=public
          DIRECT_URL: postgresql://localboost:localboost_dev@localhost:5432/localboost?schema=public
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
      - run: npm run api:check
      - run: npm run security:check
      - name: Check dashboard JavaScript syntax
        working-directory: .
        run: node --check app.js && node --check growth.js && node --check growth-intelligence.js && node --check crm.js && node --check gbp-owner.js && node --check creative-studio.js && node --check social-publishing.js && node --check growth-goals.js && node --check auth-client.js

      - name: Validate Render dashboard bundle and manual-deploy guard
        working-directory: .
        run: |
          grep -q 'cp index.html styles.css growth-intelligence.css crm.css gbp-owner.css app.js growth.js growth-intelligence.js crm.js gbp-owner.js creative-studio.js social-publishing.js growth-goals.js growth-goals.css config.js auth-client.js public-dist/' render.yaml
          for asset in index.html styles.css growth-intelligence.css crm.css gbp-owner.css app.js auth-client.js growth.js growth-intelligence.js crm.js gbp-owner.js creative-studio.js social-publishing.js growth-goals.js growth-goals.css config.js; do test -f "$asset"; done
          test "$(grep -c 'autoDeployTrigger: off' render.yaml)" -eq 2
